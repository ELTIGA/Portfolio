version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # next, eslint-config-next and react are pinned together; update them as one.
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  # apps/shell is a standalone app with its own lockfile.
  - package-ecosystem: npm
    directory: /apps/shell
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      three:
        patterns: ["three", "@types/three"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
