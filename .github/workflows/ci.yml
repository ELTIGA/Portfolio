name: CI

# Gates (audit, lint, typecheck, build, E2E) -> Vercel deploy -> post-deploy verification.
# Vercel's Git integration is off (apps/site/vercel.json), so this workflow is the only
# path to a deployment: previews for same-repo PRs, production for pushes to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@59.26.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run audit:ci
      - run: npm run lint
      - run: npm run typecheck
      # Builds the 3D intro (apps/shell -> apps/site/public/experience), then the site.
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          include-hidden-files: true
          retention-days: 3
          path: |
            apps/site/.next
            !apps/site/.next/cache
            apps/site/public/experience

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shell: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: apps/site
      - run: npx playwright install --with-deps chromium
      # Full suite (smoke, SEO, desktop, axe a11y) against `next start` on the CI build.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: playwright-report
          retention-days: 7

  deploy-preview:
    # Fork and Dependabot PRs get no secrets, so they stop at the gates above.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets are not configured; skipping the preview deploy (see README > Deploy)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ok == 'true'
        uses: ./.github/actions/setup
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=preview
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes "$VERCEL_CLI" build
      - id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  verify-preview:
    needs: deploy-preview
    if: needs.deploy-preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_URL: ${{ needs.deploy-preview.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shell: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - id: lhci
        if: success() || failure()
        run: npm run lhci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-reports
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report
            .lighthouseci/reports
      - name: Comment preview URL and Lighthouse scores
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- portfolio-preview -->";
            const url = process.env.BASE_URL;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let table = "_Lighthouse did not produce results._";
            const manifest = ".lighthouseci/reports/manifest.json";
            if (fs.existsSync(manifest)) {
              const pct = (n) => (n == null ? "–" : Math.round(n * 100));
              const rows = JSON.parse(fs.readFileSync(manifest, "utf8"))
                .filter((r) => r.isRepresentativeRun)
                .map((r) => {
                  const s = r.summary;
                  return `| \`${new URL(r.url).pathname}\` | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} |`;
                });
              table = ["| Page | Perf | A11y | Best practices | SEO |", "| --- | --- | --- | --- | --- |", ...rows].join("\n");
            }
            const status = process.env.LHCI_OUTCOME === "success" ? "✅ budgets met" : "❌ budgets not met";
            const body = [
              marker,
              `**Preview:** ${url}`,
              "",
              `**Lighthouse** (desktop, ${status}; \`is-crawlable\` skipped because previews are noindex)`,
              "",
              table,
              "",
              `Reports: [workflow run](${run}) → \`preview-reports\` artifact`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ahmedeltigani.com
    # Never cancel a production deploy halfway; queue the next one instead.
    concurrency:
      group: production
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel secrets are not configured (see README > Deploy)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx --yes "$VERCEL_CLI" pull --yes --environment=production
      - run: npx --yes "$VERCEL_CLI" build --prod
      - id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  verify-production:
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The immutable deployment URL, so this checks exactly what was just shipped.
      BASE_URL: ${{ needs.deploy-production.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shell: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report
          retention-days: 7
